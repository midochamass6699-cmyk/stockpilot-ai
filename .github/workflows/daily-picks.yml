name: Update daily StockPilot picks

on:
  schedule:
    # 06:00 Montreal time in winter / 07:00 in summer (UTC fixed).
    # Runs Monday-Friday using the previous completed trading session.
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stockpilot-daily-picks
  cancel-in-progress: false

jobs:
  update-picks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run StockPilot scanner
        run: python stock_picker.py

      - name: Commit updated picks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/picks.json
          if git diff --cached --quiet; then
            echo 'No picks data changes to commit.'
          else
            git commit -m 'Update daily StockPilot picks'
            git push
          fi
