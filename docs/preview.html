<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technofront — Mobile Preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#e9edf3;color:#172033}
.preview-heading{max-width:760px;margin:24px auto 14px;padding:0 16px;text-align:center}
.preview-heading h1{margin:0 0 6px;font-size:20px}
.preview-heading p{margin:0;color:#5c6879;font-size:13px}
.phone-shell{width:414px;max-width:calc(100vw - 24px);height:868px;margin:0 auto 32px;padding:12px;border:3px solid #202938;border-radius:38px;background:#111827;box-shadow:0 18px 55px rgba(15,23,42,.22)}
.phone-screen{display:block;width:100%;height:100%;border:0;border-radius:25px;background:#fff;overflow:auto}
@media(max-width:460px){.preview-heading{margin-top:14px}.phone-shell{height:calc(100dvh - 112px);min-height:620px;max-height:900px}}
</style>
</head>
<body>
<header class="preview-heading">
<h1>Technofront — Mobile Layout Preview</h1>
<p>This is a phone-width preview. Scroll inside the phone frame to inspect the page.</p>
</header>
<main class="phone-shell" aria-label="Mobile website preview">
<iframe class="phone-screen" src="/preview-phone.html" title="Technofront mobile page preview" loading="eager"></iframe>
</main>
</body>
</html>
