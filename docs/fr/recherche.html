a{color:#8fc9ff}.wrap{max-width:1120px;margin:auto;padding:24px 20px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}.brand{font-weight:900;letter-spacing:.3px}.back{color:var(--gold);text-decoration:none;font-weight:750}.eyebrow{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:2px}.hero{border:1px solid var(--line);background:linear-gradient(130deg,#132942,#0d1a2b);border-radius:18px;padding:28px;margin-bottom:18px}.hero h1{font-size:clamp(27px,5vw,43px);line-height:1.12;margin:8px 0}.sub{color:var(--muted);margin:0}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.tag{border:1px solid #38506b;background:#142b43;border-radius:999px;padding:4px 10px;color:#c5d7e9;font-size:12px}.tag.warn{border-color:#806a35;color:#ffdb83;background:#302819}.hero-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:22px}.stat{background:#0b1929;border:1px solid #2a4058;border-radius:12px;padding:12px}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:20px;display:block;margin-top:4px;overflow-wrap:anywhere}.positive{color:var(--green)}.negative{color:var(--red)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:20px;min-width:0}.panel h2{font-size:18px;margin:0 0 14px}.panel p{color:#c1cedb;margin:0 0 10px}.wide{grid-column:1/-1}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:var(--panel2);border-radius:10px;padding:11px}.metric span{display:block;color:var(--muted);font-size:11px}.metric strong{font-size:15px}.returns{display:grid;gap:12px}.ret{display:grid;grid-template-columns:90px 1fr 70px;align-items:center;gap:10px;font-size:13px}.track{height:10px;background:#26384d;border-radius:9px;overflow:hidden}.bar{height:100%;border-radius:9px;background:linear-gradient(90deg,#368ed0,#5dd5b0)}.bar.neg{background:linear-gradient(90deg,#d15a70,#ff9b83)}.note{border-left:3px solid var(--gold);padding:10px 13px;background:#1d2a37;border-radius:0 8px 8px 0;color:#d5dfeb}.risklist{padding-left:20px;color:#d5dfeb}.risklist li{margin:8px 0}.links{display:flex;flex-wrap:wrap;gap:10px}.links a{border:1px solid #38506b;border-radius:8px;padding:9px 12px;text-decoration:none}.foot{color:var(--muted);font-size:12px;margin-top:18px}.loading,.error{padding:50px 20px;text-align:center;color:var(--muted)}.error h1{color:var(--text)}@media(max-width:760px){.hero-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.wrap{padding:16px 13px 40px}}@media(max-width:390px){.ret{grid-template-columns:70px 1fr 58px}.metrics{grid-template-columns:1fr}}

<nav class="top"><div class="brand">STOCKPILOT AI</div><a class="back" href="./index.html">← Retour à StockPilot AI</a><a class="stockpilot-de-link" href="/de/" lang="de" aria-label="Deutsch">DE</a></nav>

</main>
<script>
const T={"title":"Rapport de recherche boursière | StockPilot AI","back":"← Retour à StockPilot AI","eyebrow":"RAPPORT DE RECHERCHE","loading":"Chargement des données de marché…","notFound":"Cette action ne figure plus dans la sélection quotidienne actuelle.","home":"Retour à l’accueil","main":"Action principale","penny":"Action à faible prix · Risque élevé","price":"Dernier cours disponible","change":"Variation quotidienne","score":"Score de recherche","updated":"Dernière mise à jour","overview":"Résumé du profil","screen":"Pourquoi ce titre apparaît dans la sélection","performance":"Performance récente","d5":"5 séances","d20":"20 séances","d50":"50 séances","technicals":"Indicateurs techniques","rsi":"RSI (14)","vol":"Volume du jour","volratio":"Volume vs moyenne 20 séances","avgvol":"Volume moyen 20 séances","dollar":"Volume moyen quotidien en dollars","ma20":"Moyenne mobile 20 séances","ma50":"Moyenne mobile 50 séances","volatility":"Volatilité quotidienne (20 séances)","position":"Position par rapport aux moyennes","above":"Au-dessus","below":"En dessous","na":"Non disponible","interpretation":"Lecture des indicateurs","risks":"Risques et limites à examiner","fundamentals":"Fondamentaux de l’entreprise","fundamentalsText":"Les données SEC peuvent être disponibles pour certaines sociétés; seules les valeurs effectivement fournies sont affichées.","sources":"Sources et vérifications","yahoo":"Consulter les données de marché sur Yahoo Finance","sec":"Rechercher les dépôts réglementaires sur SEC EDGAR","method":"Méthodologie de sélection","methodText":"Le processus de recherche exclusif de StockPilot AI examine les conditions de tendance, l’activité de négociation, la liquidité et, lorsque la couverture est suffisante, les indicateurs financiers déclarés. La formule interne de sélection n’est pas publiée. Il s’agit d’un outil de recherche, pas d’une évaluation complète de la qualité d’une entreprise.","sourceLabel":"Source des données","dataNote":"Note sur les données","disclaimer":"Information générale à des fins éducatives seulement. Ce rapport n’est pas un conseil financier personnalisé ni une recommandation d’achat ou de vente. Les données peuvent être retardées ou incomplètes.","riskPenny":"Titre à faible prix : la volatilité, la liquidité limitée, les écarts acheteur-vendeur et le risque de perte peuvent être importants.","riskRsi":"RSI élevé : le mouvement récent peut être étiré et sujet à des fluctuations rapides.","riskVol":"Volatilité élevée : les variations de prix observées sont importantes.","riskLiquidity":"Volume moyen en dollars limité : il peut être plus difficile d’acheter ou de vendre sans influencer le prix.","riskData":"La couverture du fournisseur est limitée et ne représente pas nécessairement l’ensemble du marché.","notIn":"Non classé dans les données du secteur","market":"Marché","exchange":"Bourse","currency":"Devise","date":"Date du cours","returnLabel":"Rendement","today":"aujourd’hui","unknown":"Non fourni","company":"Société","classification":"Classification du secteur","businessText":"Le flux actuel ne fournit pas de description d’entreprise vérifiée. Nous n’inférons pas les activités de la société à partir de son seul nom ou symbole."};
const DATA_URL="../data/picks.json";
const params=new URLSearchParams(location.search);
const ticker=(params.get('ticker')||'').trim().toUpperCase();
const kind=(params.get('kind')||'main').toLowerCase();
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=2)=>Number.isFinite(Number(v))?Number(v).toLocaleString('fr-CA',{minimumFractionDigits:d,maximumFractionDigits:d}):T.na;
const pct=v=>Number.isFinite(Number(v))?(Number(v)>0?'+':'')+num(v)+'%':T.na;
const cash=(v,c)=>Number.isFinite(Number(v))?(c==='CAD'?'CA$':'US$')+num(v,Number(v)<1?4:2):T.na;
function metric(label,value){return '<div class="metric"><span>'+label+'</span><strong>'+value+'</strong></div>'}
function ret(label,value){if(!Number.isFinite(Number(value)))return '';const n=Number(value),w=Math.min(100,Math.abs(n));return '<div class="ret"><span>'+label+'</span><div class="track"><div class="bar '+(n<0?'neg':'')+'" style="width:'+w+'%"></div></div><strong class="'+(n<0?'negative':'positive')+'">'+pct(n)+'</strong></div>'}
function renderFundamentals(s){
 const f=s.fundamentals&&s.fundamentals.metrics?s.fundamentals:null;
 if(!f)return '<p>Les données fondamentales des dépôts SEC sont absentes ou insuffisantes pour cette société dans le relevé actuel. Aucun chiffre n’est estimé ni inventé.</p>';
 const m=f.metrics||{},rows=[];
 const money=v=>Number.isFinite(Number(v))?new Intl.NumberFormat('fr-CA',{style:'currency',currency:'USD',notation:'compact',maximumFractionDigits:2}).format(Number(v)):'';
 const add=(label,v,fmt)=>{if(v!==null&&v!==undefined&&Number.isFinite(Number(v)))rows.push(metric(label,fmt?fmt(v):money(v)));};
 add('Chiffre d’affaires',m.revenue);add('Bénéfice brut',m.grossProfit);add('Résultat opérationnel',m.operatingIncome);add('Résultat net',m.netIncome);
 add('Actif total',m.assets);add('Passif total',m.liabilities);add('Capitaux propres',m.equity);add('Trésorerie et équivalents',m.cash);
 add('Flux de trésorerie d’exploitation',m.operatingCashFlow);add('Dette à court terme',m.currentDebt);add('Dette à long terme',m.longTermDebt);
 add('Marge brute',m.revenue&&m.grossProfit!==null&&m.grossProfit!==undefined?Number(m.grossProfit)/Number(m.revenue)*100:null,v=>num(v,1)+' %');
 add('Marge opérationnelle',m.revenue&&m.operatingIncome!==null&&m.operatingIncome!==undefined?Number(m.operatingIncome)/Number(m.revenue)*100:null,v=>num(v,1)+' %');
 add('Marge nette',m.revenue&&m.netIncome!==null&&m.netIncome!==undefined?Number(m.netIncome)/Number(m.revenue)*100:null,v=>num(v,1)+' %');
 add('Passif / actif',m.assets&&m.liabilities!==null&&m.liabilities!==undefined?Number(m.liabilities)/Number(m.assets)*100:null,v=>num(v,1)+' %');
 const debt=Number(m.currentDebt||0)+Number(m.longTermDebt||0);
 add('Trésorerie / dette',debt>0&&m.cash!==null&&m.cash!==undefined?Number(m.cash)/debt*100:null,v=>num(v,1)+' %');
 if(f.revenue_growth_percent!==null&&f.revenue_growth_percent!==undefined&&Number.isFinite(Number(f.revenue_growth_percent)))add('Croissance du chiffre d’affaires (sur un an)',f.revenue_growth_percent,v=>(Number(v)>0?'+':'')+num(v,1)+' %');
 const basis=s.score_basis==='SEC fundamentals + market data'?'L’évaluation actuelle combine les indicateurs des dépôts SEC disponibles et les données de marché.':'L’évaluation actuelle repose uniquement sur les données de marché, car la couverture des dépôts SEC était absente ou insuffisante.';
 const coverage=Array.isArray(s.fundamental_coverage)&&s.fundamental_coverage.length?'Indicateurs disponibles : '+s.fundamental_coverage.map(x=>esc(x.replace(/_/g,' '))).join(', ')+'.':'';
 const conf=s.fundamental_confidence&&s.fundamental_confidence!=='not rated'?'Niveau de couverture : '+esc(s.fundamental_confidence)+'.':'';
 return '<p>'+basis+'</p>'+(f.fiscal_year?'<p>Dernier exercice financier représenté : '+esc(f.fiscal_year)+'.</p>':'')+'<div class="metrics">'+rows.join('')+'</div>'+(coverage?'<p class="foot">'+coverage+'</p>':'')+(conf?'<p class="foot">'+conf+'</p>':'')+'<p class="foot">Source : SEC EDGAR Company Facts. Les valeurs déclarées sont historiques et non des données en temps réel.</p>';
}
function render(s,penny,data){
 const currency=s.currency||'USD',name=esc(s.company||s.ticker),exchange=esc(s.exchange||T.unknown),market=esc(s.market||T.unknown);
 const ch=Number(s.change_percent),price=Number(s.price),rsi=Number(s.rsi),volatility=Number(s.volatility_20d),ratio=Number(s.volume_ratio),avgDollar=Number(s.average_dollar_volume_20d);
 const trend20=s.above_20day_average===true?T.above:s.above_20day_average===false?T.below:T.na;
 const trend50=s.above_50day_average===true?T.above:s.above_50day_average===false?T.below:T.na;
 const readings=[];
 if(Number.isFinite(Number(s.return_20d))&&Number.isFinite(Number(s.return_50d)))readings.push(Number(s.return_20d)>0&&Number(s.return_50d)>0?"Les rendements à 20 et 50 séances sont positifs, ce qui indique une tendance récente haussière dans la fenêtre mesurée.":Number(s.return_20d)<0&&Number(s.return_50d)<0?"Les rendements à 20 et 50 séances sont négatifs, ce qui indique une tendance récente baissière dans la fenêtre mesurée.":"Les rendements à 20 et 50 séances divergent; la tendance manque de confirmation entre les deux périodes.");
 if(Number.isFinite(ratio))readings.push(ratio>1.5?"Le volume dépasse nettement sa moyenne sur 20 séances; l’activité récente est supérieure à la normale.":ratio<0.75?"Le volume est inférieur à sa moyenne sur 20 séances; la hausse ou la baisse récente est accompagnée d’une participation plus faible.":"Le volume est relativement proche de sa moyenne sur 20 séances.");
 if(Number.isFinite(rsi))readings.push(rsi>=70?"Le RSI est élevé (70 ou plus), ce qui peut signaler un mouvement à court terme étiré; ce n’est pas un signal autonome.":rsi<=30?"Le RSI est faible (30 ou moins); cela décrit une faiblesse récente, sans prédire à lui seul un rebond.":"Le RSI se situe dans une zone intermédiaire selon le seuil courant de 30 à 70.");
 const risks=[];
 if(penny)risks.push(T.riskPenny);
 if(Number.isFinite(rsi)&&rsi>=70)risks.push(T.riskRsi);
 if(Number.isFinite(volatility)&&volatility>=5)risks.push(T.riskVol);
 if(Number.isFinite(avgDollar)&&avgDollar<1000000)risks.push(T.riskLiquidity);
 risks.push(T.riskData);
 const stamp=data.updated_at||data.generated_at_utc||T.unknown;
 const y='https://finance.yahoo.com/quote/'+encodeURIComponent(s.ticker||'');
 const sec='https://www.sec.gov/edgar/search/#/q='+encodeURIComponent(s.ticker||'');
 $('report').className='';
 $('report').innerHTML=`
 <header class="hero">
  <div class="eyebrow">${T.eyebrow}</div><h1>${name} <span style="color:var(--gold)">(${esc(s.ticker)})</span></h1>
  <p class="sub">${penny?T.penny:T.main} · ${exchange} · ${market}</p>
  <div class="tags"><span class="tag">${T.company}: ${name}</span><span class="tag">${T.classification}: ${esc(s.sector||T.notIn)}</span><span class="tag">${T.currency}: ${esc(currency)}</span><span class="tag">${T.date}: ${esc(s.price_date||s.quote_time||T.unknown)}</span>${penny?'<span class="tag warn">RISQUE ÉLEVÉ</span>':''}</div>
  <div class="hero-grid">
   <div class="stat"><small>${T.price}</small><strong>${cash(price,currency)}</strong></div>
   <div class="stat"><small>${T.change}</small><strong class="${ch>=0?'positive':'negative'}">${pct(ch)}</strong></div>
   <div class="stat"><small>${T.score}</small><strong>${num(s.score,1)} / 100</strong></div>
   <div class="stat"><small>${T.updated}</small><strong style="font-size:13px">${esc(stamp)}</strong></div>
  </div>
 </header>
 <div class="grid">
  <section class="panel"><h2>${T.overview}</h2><p>${esc(s.company||s.ticker)} figure dans le filtre StockPilot AI des ${penny?'actions à faible prix':'actions principales'} pour le relevé actuel. Le jeu de données fourni classe son secteur comme ${esc(s.sector||T.notIn)} et l’indique à la bourse ${exchange}.</p><p>${T.businessText}</p><div class="note">${T.screen}: ${esc(s.reason||T.unknown)}</div></section>
  <section class="panel"><h2>${T.performance}</h2><div class="returns">${ret(T.d5,s.return_5d)}${ret(T.d20,s.return_20d)}${ret(T.d50,s.return_50d)}</div><p class="foot">Rendements calculés à partir des cours quotidiens fournis par la source; les périodes passées ne prédisent pas les résultats futurs.</p></section>
  <section class="panel"><h2>${T.technicals}</h2><div class="metrics">
   ${metric(T.rsi,num(rsi,1))}${metric(T.vol,Number.isFinite(Number(s.volume))?num(s.volume,0):T.na)}
   ${metric(T.volratio,Number.isFinite(ratio)?num(ratio,2)+'×':T.na)}${metric(T.avgvol,num(s.average_volume_20d,0))}
   ${metric(T.dollar,Number.isFinite(avgDollar)?(currency==='CAD'?'CA$':'US$')+num(avgDollar,0):T.na)}
   ${metric(T.volatility,Number.isFinite(volatility)?num(volatility,2)+'%':T.na)}
   ${metric(T.ma20,cash(s.ma20,currency))}${metric(T.ma50,cash(s.ma50,currency))}
   ${metric(T.position,'20d: '+trend20+' · 50d: '+trend50)}
  </div></section>
  <section class="panel"><h2>${T.interpretation}</h2><ul class="risklist">${readings.map(x=>'<li>'+x+'</li>').join('')||'<li>'+T.na+'</li>'}</ul><p class="foot">Ces observations décrivent les données affichées et ne prédisent pas la direction future du titre.</p></section>
  <section class="panel"><h2>${T.risks}</h2><ul class="risklist">${risks.map(x=>'<li>'+x+'</li>').join('')}</ul><p class="foot">${esc(s.risk||T.unknown)}</p></section>
  <section class="panel"><h2>${T.fundamentals}</h2>${renderFundamentals(s)}</section>
  <section class="panel wide"><h2>${T.method}</h2><p>${T.methodText}</p><p><strong>${T.sourceLabel}:</strong> ${esc(data.data_source||data.source||T.unknown)}</p><p><strong>${T.dataNote}:</strong> ${esc(data.data_note||T.unknown)}</p></section>
  <section class="panel wide"><h2>${T.sources}</h2><div class="links"><a href="${y}" target="_blank" rel="noopener noreferrer">${T.yahoo} ↗</a><a href="${sec}" target="_blank" rel="noopener noreferrer">${T.sec} ↗</a></div><p class="foot">${T.disclaimer}</p></section>
 </div>
 <p class="foot">${T.updated}: ${esc(stamp)} · StockPilot AI</p>`;
}
async function init(){
 if(!ticker){$('report').innerHTML='<div class="error"><h1>Stock not specified</h1><a href="'+home+'">'+T.home+'</a></div>';return;}
 try{
  const res=await fetch(DATA_URL+'?v='+Date.now(),{cache:'no-store'});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const data=await res.json();
  const list=kind==='penny'?(data.penny||[]):(data.main||[]);
  const stock=list.find(x=>String(x.ticker||'').toUpperCase()===ticker);
  if(!stock){$('report').innerHTML='<div class="error"><h1>'+T.notFound+'</h1><a href="'+home+'">'+T.home+'</a></div>';return;}
  document.title='Analyse de '+ticker+' | StockPilot AI';
  render(stock,kind==='penny',data);
 }catch(e){$('report').innerHTML='<div class="error"><h1>'+T.loading+'</h1><p>'+esc(e.message)+'</p><a href="'+home+'">'+T.home+'</a></div>';}
}
init();
</script>
