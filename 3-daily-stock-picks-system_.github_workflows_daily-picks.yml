name: Update daily stock picks
on:
  workflow_dispatch:
  schedule:
    # 5:30 p.m. Toronto time, Monday-Friday (after both US and Canadian regular sessions)
    - cron: "30 17 * * 1-5"
      timezone: "America/Toronto"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate picks
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python stock_picker.py
      - name: Publish updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/picks.json
          git diff --cached --quiet || git commit -m "Update daily stock picks"
          git push
